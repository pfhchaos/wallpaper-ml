[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wallpaper-ml"
version = "0.1.0"
description = "Vulkan compute ML framework — PyTorch-style layers, losses, models for audio-reactive wallpapers"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "vulkan",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
wallpaper_ml = ["shaders/cnn/*.comp", "shaders/rnn/*.comp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Mirrors the root monorepo pyproject.toml's pytest config (see its
# [tool.pytest.ini_options] comment) so this package's test suite is
# self-sufficient when run standalone — from its own rootdir, outside the
# monorepo — ahead of the 0.9 repo split. --import-mode=importlib avoids
# the cwd-shadow footgun where a stray same-named directory on sys.path
# masks the installed package.
addopts = "--tb=short -m 'not slow' --import-mode=importlib --strict-markers"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]
